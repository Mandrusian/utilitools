name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check install.sh
        run: bash -n pymisctools/install.sh
      - name: Run PYCalc unit tests
        run: python3 pymisctools/PYCalc/test_pycalc.py
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
