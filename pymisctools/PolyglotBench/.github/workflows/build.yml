name: bench
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ rustc ruby
      - name: Run bench
        run: python3 polyglotbench.py --no-color
